name: RCIP CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: rcip-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the pinned npm toolchain
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  browser:
    name: Browser behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Use the pinned npm toolchain
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:starter

  secrets:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/scan-secrets.mjs

  website:
    name: Documentation and static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Use the pinned npm toolchain
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
